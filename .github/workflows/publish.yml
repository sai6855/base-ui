name: Publish packages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to release from'
        required: true
        type: string
      dry-run:
        description: 'Run in dry-run mode without actually publishing packages'
        required: false
        type: boolean
        default: false
      github-release:
        description: 'Create a GitHub release after publishing'
        required: false
        type: boolean
        default: true
      dist-tag:
        description: 'npm dist tag to publish to'
        required: false
        type: string
        default: 'latest'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing tags and creating releases
      id-token: write # Required for provenance
    environment:
      name: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # Fetch full history for proper git operations
      - name: Prepare for publishing
        uses: mui/mui-public/.github/actions/publish-prepare@0534c1cc1a7f0f170d927199ec407192a656e81f # master
        with:
          node-version: '22.23.2'
      - name: Publish packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workflow inputs are read through the environment rather than interpolated
          # into the script: `${{ inputs.dist-tag }}` is a free-form string, and expanding
          # it inline would run its contents as shell in the job that holds the npm
          # publishing credentials.
          DRY_RUN: ${{ inputs.dry-run }}
          GITHUB_RELEASE: ${{ inputs.github-release }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          # Build common flags
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$GITHUB_RELEASE" = "true" ]; then
            ARGS+=(--github-release)
          fi
          if [ -n "$DIST_TAG" ]; then
            ARGS+=(--tag "$DIST_TAG")
          fi

          pnpm code-infra publish --ci "${ARGS[@]}"
